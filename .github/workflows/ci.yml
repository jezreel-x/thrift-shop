name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the workflow be re-run on demand, without an empty commit to provoke it.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    env:
      # The build compiles routes that import the Prisma client but never opens a
      # connection, so a syntactically valid placeholder is enough here. Real
      # credentials live in the Vercel project settings.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # postinstall runs `prisma generate`, which the typecheck depends on:
      # the generated client is not committed.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
